# The console: read a line, print the tables and the document.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# The front end runs in the main thread, with its large arrays static rather
# than on this stack.
CONFIG_MAIN_STACK_SIZE=8192

# Zephyr's own code optimised for speed rather than size; this repository's
# sources get -O3 from CMakeLists.txt either way.
CONFIG_SPEED_OPTIMIZATIONS=y
