# Package a release's binaries for Linux, Termux, Windows and Android, and test
# every package by installing it the way a user would.
#
# Two ways in. release.yml calls this with the tag it is releasing, after its
# build jobs have left the binaries as artifacts of the same run, and attaches
# what comes out -- or, for a trial run, with the commit it built as `ref`, so
# the packaging checked out is that commit's and not a tag that does not exist
# yet. Pushed on its own -- a change to the packaging, the window or
# this file -- it packages the binaries of the latest published release
# instead, so the packaging can be worked on without cutting a release, and it
# uploads nothing but run artifacts.
#
# The rule everything here follows is the one release.yml exists for: a hub
# verifies a result by the digest of the binary that measured it, so every
# package carries the release binary byte for byte. Nothing is rebuilt,
# stripped or signed on the way in, and every test job checks the installed
# file's digest against the release asset's -- as well as the digest the
# benchmark reports for itself.
#
# Secrets: the Android signing key, and only in the job that signs the APK --
# ANDROID_KEYSTORE (the keystore, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; see packaging/README.md for making
# them. The keystore is written to the runner's temporary directory for the one
# step that needs it and deleted at its end; the passwords reach apksigner
# through the environment, never a command line. Without the secrets the APK is
# signed with a throwaway key and the run says so. Otherwise the only
# credential is the per-run GITHUB_TOKEN, read-only here, which `gh` uses to
# download the latest release's assets.

name: packages

on:
  workflow_call:
    inputs:
      tag:
        description: "the release being built; its binaries are this run's build-* artifacts"
        required: true
        type: string
      ref:
        description: "what to check out, when not the tag: the commit a trial run of release.yml was dispatched on"
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  push:
    paths:
      - "packaging/**"
      - "gui/**"
      - "android/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions: {}

env:
  # Pinned to a version and a digest, like the llvm-mingw in release.yml: it
  # is what puts the release binaries into the Linux packages.
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783

jobs:
  # What is being packaged, and from where: the calling release's tag and the
  # binaries its build jobs left, or the latest release's tag and its assets.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.what.outputs.version }}
      ref: ${{ steps.what.outputs.ref }}
    steps:
      - id: what
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "ref=${REF:-$TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "packaging $GITHUB_SHA with the binaries of $latest"
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
              --pattern 'cpcpub-*' --pattern SHA256SUMS --dir rel
          # The assets are only as good as the checksums published beside them.
          (cd rel && sha256sum -c --ignore-missing SHA256SUMS && rm SHA256SUMS)
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # Pushed or dispatched rather than called, there is no tag.
      - if: ${{ !inputs.tag }}
        uses: actions/upload-artifact@v7
        with:
          name: build-latest-release
          path: rel/
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: rel
          merge-multiple: true
      - name: Install nfpm
        run: |
          set -eux
          tgz="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$tgz"
          echo "$NFPM_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" nfpm
          sudo install -m 755 nfpm /usr/local/bin/nfpm
          nfpm --version
      # Dated by the commit being packaged, so the same commit packages to the
      # same bytes whenever it is run.
      - name: Build the packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eux
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 packaging/linux/build.py rel "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Installed in containers of the distributions they are for, on both
  # architectures there are runners for. The arm64 runner also runs Termux's
  # own image, natively.
  linux-test:
    needs: [prepare, linux]
    name: linux-test (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: rel
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux
          path: pkgs
      - run: sh packaging/linux/test.sh pkgs rel

  # The window for Windows: Python, PyGObject and GTK 4 from MSYS2, frozen with
  # PyInstaller, natively on each machine.
  windows-gui:
    needs: prepare
    name: windows-gui (${{ matrix.machine }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runs-on: windows-2025
            machine: x64
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
          - runs-on: windows-11-arm
            machine: arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gtk4
            ${{ matrix.prefix }}-python-gobject
            ${{ matrix.prefix }}-pyinstaller
      - run: sh packaging/windows/build-gui.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-gui-${{ matrix.machine }}
          path: dist/cpcpub-gui/
          if-no-files-found: error
          retention-days: 7

  # One setup program for both machines, compiled by Inno Setup from the
  # release binaries and the window's folder.
  windows-installer:
    needs: [prepare, windows-gui]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: rel
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-gui-x64
          path: gui-x64
      - uses: actions/download-artifact@v8
        with:
          name: windows-gui-arm64
          path: gui-arm64
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The runner images carry Inno Setup; install it only if this one
          # does not.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) { throw "choco exited $LASTEXITCODE" }
          }
          ./packaging/windows/build-installer.ps1 -Release rel -GuiX64 gui-x64 -GuiArm64 gui-arm64 `
              -Version $env:VERSION -Out dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The same setup on each machine, which has to install that machine's own
  # benchmark build.
  windows-test:
    needs: [prepare, windows-installer]
    name: windows-test (${{ matrix.machine }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025
            machine: x64
          - runs-on: windows-11-arm
            machine: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: rel
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: packages-windows
          path: pkgs
      - shell: pwsh
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          $setup = (Get-ChildItem "pkgs/*-windows-setup.exe").FullName
          ./packaging/windows/test-installer.ps1 -Setup $setup `
              -Release (Resolve-Path rel).Path -Machine $env:MACHINE

  # The Android app: the release's static Android binary inside an APK, built
  # with the SDK's own tools (see android/build.sh) and signed. There is no
  # install test to run here -- an x86 emulator's Arm translation cannot run a
  # static binary, and the arm64 runners have no emulator -- so the checks are
  # what can be read off the APK: its signature, its manifest, and the
  # embedded binary's digest. The binary itself was run under qemu by the
  # release build, and natively in Termux's image by linux-test.
  android:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: rel
          merge-multiple: true
      # Named rather than whatever the image has that day, so a release's APK
      # does not change with the runner image.
      - name: Install the SDK pieces
        run: |
          set -eux
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" "build-tools;35.0.0" > /dev/null
          javac -version
      - name: Build and sign the APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TOOLS_VERSION: "35.0.0"
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/release.keystore"
            trap 'rm -f "$ks"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            export ANDROID_KEYSTORE="$ks"
          else
            echo "::warning title=Throwaway APK key::No ANDROID_KEYSTORE secret, so" \
                 "the APK is signed with a throwaway key and will not install over" \
                 "any other build. See packaging/README.md."
          fi
          android/build.sh rel "$VERSION" dist
          "$BUILD_TOOLS/aapt2" dump badging dist/*.apk \
            | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-android
          path: dist/
          if-no-files-found: error
          retention-days: 7
